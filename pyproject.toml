[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iiot-maintenance-agent"
version = "0.2.0"
description = "Condition monitoring with zero infrastructure: OPC UA or MQTT, a local dashboard and optional GitHub Pages snapshots."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Suleman Ali" }]
keywords = ["iiot", "opc-ua", "mqtt", "condition-monitoring", "maintenance", "industrial-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = ["asyncua>=1.1,<3", "paho-mqtt>=2,<3", "opcua-tagmap>=0.3,<1"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.urls]
Repository = "https://github.com/sulemanali5760/iiot-maintenance-agent"

[project.scripts]
iiot-agent = "iiot_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iiot_agent = ["manual/*.md", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
