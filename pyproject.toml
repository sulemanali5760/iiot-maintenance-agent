[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iiot-maintenance-agent"
version = "0.1.0"
description = "A simulated shop-floor to maintenance notification chain."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Suleman Ali" }]
dependencies = ["asyncua>=1.1,<3", "paho-mqtt>=2,<3"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.scripts]
iiot-agent = "iiot_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iiot_agent = ["manual/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
