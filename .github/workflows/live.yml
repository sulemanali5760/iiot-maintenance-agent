name: live
on:
  # schedule enabled once the public server is verified
  # schedule:
    # - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      browse:
        description: Browse the public server instead of publishing a snapshot
        type: boolean
        default: false
permissions:
  contents: write
concurrency: live
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Browse public server
        if: inputs.browse == true
        run: iiot-agent browse opc.tcp://milo.digitalpetri.com:62541/milo
      - name: Collect and push snapshot to gh-pages
        if: inputs.browse != true
        run: iiot-agent snapshot -c examples/public-demo.toml --duration 60 --push
        env:
          IIOT_AGENT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
