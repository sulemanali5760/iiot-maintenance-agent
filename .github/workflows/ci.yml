name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt -e .
      - name: Start local MQTT broker
        if: runner.os == 'Linux'
        run: docker run -d -p 1883:1883 eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf && sleep 3
      - name: Tests (offline chain and localhost integration)
        env:
          MQTT_HOST: ${{ runner.os == 'Linux' && '127.0.0.1' || '' }}
        run: python -m pytest -v
      - name: Demo run (output shown in the README)
        run: iiot-agent demo
      - name: Known vulnerabilities in dependencies
        run: python -m pip_audit -r requirements-dev.txt
