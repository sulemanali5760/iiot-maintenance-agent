# Public umati sample server (VDMA umati showcase, opc.tcp://opcua.umati.app:4843).
# The robot below is a sample device on that server; its values are simulated by the server.
# NodeIds checked with a browse from GitHub Actions on 17 Nov 2026; check again with:
#   iiot-agent browse opc.tcp://opcua.umati.app:4843
[source]
type = "opcua"
endpoint = "opc.tcp://opcua.umati.app:4843"
security_policy = "None"
sampling_ms = 1000

[[tags]]
name = "axis1_speed"
asset = "umati-robot"
node = "ns=32;i=6024"
unit = "deg/s"
warn = 17.0
alarm = 19.0

[[tags]]
name = "axis2_speed"
asset = "umati-robot"
node = "ns=32;i=6033"
unit = "deg/s"
warn = 17.0
alarm = 19.0

[[tags]]
name = "motor1_temperature"
asset = "umati-robot"
node = "ns=32;i=6054"
unit = "degC"
warn = 17.0
alarm = 19.0

[store]
path = "iiot-agent.db"
keep_days = 7

[github]
enabled = true
repo = "sulemanali5760/iiot-maintenance-agent"
branch = "gh-pages"
every_minutes = 15
history_days = 7
token_env = "IIOT_AGENT_GITHUB_TOKEN"
label = "umati sample robot (public OPC UA server, simulated values)"
